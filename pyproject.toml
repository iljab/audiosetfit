[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AudioSetFit"
version = "0.1.0"
description = "Efficient few-shot audio classification with contrastive fine-tuning (a SetFit for audio)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ilja Baumann" }]
keywords = ["audio", "speech", "few-shot", "classification", "contrastive-learning", "setfit", "clap", "transformers"]

dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "torchcodec>=0.4",
    "tqdm>=4.65",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 119
target-version = "py39"
