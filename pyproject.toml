[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiosetfit"
dynamic = ["version"]
description = "Efficient few-shot audio classification with contrastive fine-tuning (a SetFit for audio)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ilja Baumann" }]
keywords = ["audio", "speech", "few-shot", "classification", "contrastive-learning", "setfit", "clap", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=4.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "torchcodec>=0.4",
    "tqdm>=4.65",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/iljab/audiosetfit"
Repository = "https://github.com/iljab/audiosetfit"
Issues = "https://github.com/iljab/audiosetfit/issues"

[tool.setuptools.dynamic]
version = { attr = "audiosetfit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiosetfit = ["py.typed"]

[tool.ruff]
line-length = 119
target-version = "py39"
